[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phyres"
version = "0.2.0"
description = "A modular benchmark suite of physics-residual world models with calibrated epistemic uncertainty for safe model-based control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yiannos Stergiou" }]
keywords = [
  "physical-ai",
  "world-models",
  "model-based-control",
  "epistemic-uncertainty",
  "residual-physics",
  "mpc",
  "mppi",
  "benchmark-suite",
  "continual-learning",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "seaborn>=0.13", "jupyter>=1.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
